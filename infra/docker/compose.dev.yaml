services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fpllm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fpllm"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - fpllm_postgres:/var/lib/postgresql/data

volumes:
  fpllm_postgres:
