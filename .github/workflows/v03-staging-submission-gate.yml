name: v0.3 Staging Submission Gate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Candidate branch, tag, or immutable commit to execute"
        required: true
        type: string
        default: "platform/v0.3-real-submission-execution"
      repository_owner:
        description: "Repository owner installed on the staging GitHub App"
        required: true
        type: string
        default: "ElephantRock"
      repository_name:
        description: "Repository containing immutable good/bad fixture commits"
        required: true
        type: string
        default: "First-principles-LLM-Research"
      good_commit_sha:
        description: "Known-good immutable learner commit"
        required: true
        type: string
        default: "c29f8a28cb56d2b50d5139bae1a7747ddf495c89"
      bad_commit_sha:
        description: "Known-bad immutable learner commit expected to fail hidden evaluation"
        required: true
        type: string
        default: "3ccf5ba08f37c5d35b56e66b9e78993eb117d93f"
      learner_image:
        description: "Published learner runtime image, including @sha256 digest"
        required: true
        type: string
      evaluator_image:
        description: "Published hidden evaluator runtime image, including @sha256 digest"
        required: true
        type: string
      confirm_staging:
        description: "Enter STAGING to run against the configured GitHub App installation"
        required: true
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  submission-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpllm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fpllm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fpllm?schema=public
      COURSE_CONTENT_ROOT: ./course
      FPLLM_DEMO_HANDLE: demo
      GITHUB_APP_ID: ${{ secrets.FPLLM_STAGING_GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.FPLLM_STAGING_GITHUB_APP_PRIVATE_KEY }}
      FPLLM_STAGING_GITHUB_INSTALLATION_ID: ${{ secrets.FPLLM_STAGING_GITHUB_INSTALLATION_ID }}
      FPLLM_STAGING_REPOSITORY_OWNER: ${{ inputs.repository_owner }}
      FPLLM_STAGING_REPOSITORY_NAME: ${{ inputs.repository_name }}
      FPLLM_STAGING_GOOD_SHA: ${{ inputs.good_commit_sha }}
      FPLLM_STAGING_BAD_SHA: ${{ inputs.bad_commit_sha }}
      FPLLM_TEST_RUNTIME_IMAGE: ${{ inputs.learner_image }}
      FPLLM_HIDDEN_EVALUATOR_IMAGE: ${{ inputs.evaluator_image }}
      FPLLM_PRIVATE_BUNDLE_TAR_B64: ${{ secrets.FPLLM_PRIVATE_BUNDLE_TAR_B64 }}
      FPLLM_WORKER_LEASE_SECONDS: "300"
      FPLLM_WORKER_POLL_MS: "250"
      FPLLM_WORKER_ONCE: "1"

    steps:
      - name: Require explicit staging confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_staging }}" != "STAGING" ]]; then
            echo "confirm_staging must equal STAGING" >&2
            exit 1
          fi
          for name in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY FPLLM_STAGING_GITHUB_INSTALLATION_ID FPLLM_PRIVATE_BUNDLE_TAR_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured" >&2
              exit 1
            fi
          done
          if [[ ! "$FPLLM_TEST_RUNTIME_IMAGE" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "learner_image must be digest pinned" >&2
            exit 1
          fi
          if [[ ! "$FPLLM_HIDDEN_EVALUATOR_IMAGE" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "evaluator_image must be digest pinned" >&2
            exit 1
          fi
          if [[ ! "$FPLLM_STAGING_GOOD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$FPLLM_STAGING_BAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "fixture commits must be full 40-character SHAs" >&2
            exit 1
          fi

      - name: Checkout selected candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 1

      - name: Capture immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate did not resolve to a full commit SHA" >&2
            exit 1
          fi
          echo "FPLLM_STAGING_CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "candidate_ref=${{ inputs.candidate_ref }}"
          echo "candidate_sha=$candidate_sha"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate candidate staging machinery exists
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/worker/src/staging.ts
          test -f scripts/ops/verify_worker_host.py
          test -f scripts/staging/materialize_private_bundle.py
          test -f hidden-tests/phase1/causal-attention/private-bundle-commitment.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migration
        run: pnpm --filter @fpllm/db exec prisma migrate deploy

      - name: Seed staging database
        run: pnpm db:seed

      - name: Login to GHCR for digest-addressed runtime pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable runtime images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$FPLLM_TEST_RUNTIME_IMAGE"
          docker pull "$FPLLM_HIDDEN_EVALUATOR_IMAGE"

      - name: Materialize committed private evaluator bundle
        shell: bash
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/fpllm-private-test-bundles"
          python scripts/staging/materialize_private_bundle.py \
            --output-root "$private_root" \
            --bundle-id phase1-causal-attention@1.0 \
            --commitment hidden-tests/phase1/causal-attention/private-bundle-commitment.json
          echo "FPLLM_PRIVATE_TEST_BUNDLE_ROOT=$private_root" >> "$GITHUB_ENV"
          echo "FPLLM_PUBLIC_TEST_BUNDLE_ROOT=$GITHUB_WORKSPACE/test-bundles/public" >> "$GITHUB_ENV"
          echo "FPLLM_WORKER_TEMP_ROOT=$RUNNER_TEMP/fpllm-worker" >> "$GITHUB_ENV"
          echo "FPLLM_STAGING_EVIDENCE_PATH=$GITHUB_WORKSPACE/.artifacts/staging/staging-submission-e2e.json" >> "$GITHUB_ENV"

      - name: Verify staging worker-host boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FPLLM_WORKER_TEMP_ROOT" .artifacts/staging
          python scripts/ops/verify_worker_host.py \
            --learner-image "$FPLLM_TEST_RUNTIME_IMAGE" \
            --evaluator-image "$FPLLM_HIDDEN_EVALUATOR_IMAGE" \
            --worker-temp-root "$FPLLM_WORKER_TEMP_ROOT" \
            --public-bundle-root "$FPLLM_PUBLIC_TEST_BUNDLE_ROOT" \
            --private-bundle-root "$FPLLM_PRIVATE_TEST_BUNDLE_ROOT" \
            --output .artifacts/staging/worker-host-preflight.json

      - name: Execute real GitHub App -> worker -> Docker -> persisted evidence path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FPLLM_WORKER_TEMP_ROOT"
          pnpm --dir packages/db exec tsx ../../apps/worker/src/staging.ts

      - name: Bind staging artifact to candidate source commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('.artifacts/staging/staging-submission-e2e.json')
          doc = json.loads(path.read_text())
          doc['candidate'] = {
              'ref': os.environ['FPLLM_CANDIDATE_REF'],
              'sourceCommit': os.environ['FPLLM_STAGING_CANDIDATE_SHA'],
          }
          path.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n')
          PY
        env:
          FPLLM_CANDIDATE_REF: ${{ inputs.candidate_ref }}

      - name: Upload staging release-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v03-staging-submission-gate-${{ github.run_id }}
          path: .artifacts/staging/
          if-no-files-found: error
          retention-days: 30
