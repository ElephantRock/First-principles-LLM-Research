name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpllm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fpllm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fpllm?schema=public
      COURSE_CONTENT_ROOT: ./course
      FPLLM_DEMO_HANDLE: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture bootstrap lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migration
        run: pnpm --filter @fpllm/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Validate course content
        run: pnpm content:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
