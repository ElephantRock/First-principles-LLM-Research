name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpllm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fpllm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fpllm?schema=public
      COURSE_CONTENT_ROOT: ./course
      FPLLM_DEMO_HANDLE: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migration
        run: pnpm --filter @fpllm/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Validate course content
        run: pnpm content:validate

      - name: Validate probe protocol runtime
        run: |
          python -m py_compile \
            infra/docker/test-runtime/probe/protocol.py \
            infra/docker/test-runtime/probe/serve.py \
            infra/docker/test-runtime/probe/adapters/causal_attention_v1.py \
            test-bundles/public/phase1-causal-attention@1.0/runner.py
          python -m unittest discover \
            -s infra/docker/test-runtime/tests \
            -p 'test_*.py' \
            -v

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @fpllm/web exec playwright install --with-deps chromium webkit

      - name: End-to-end vertical slice
        run: pnpm --filter @fpllm/web test:e2e
