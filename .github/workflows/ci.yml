name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpllm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fpllm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fpllm?schema=public
      COURSE_CONTENT_ROOT: ./course
      FPLLM_DEMO_HANDLE: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migration
        run: pnpm --filter @fpllm/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Validate course content
        run: pnpm content:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit bootstrap lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bootstrap/platform-v0.2'
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git checkout -B lockfile-bootstrap "origin/${{ github.event.pull_request.head.ref }}"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add pnpm lockfile"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
