id: phase1-causal-attention-lab
version: "1.0"
requirements:
  - Q projection produces 12 query heads
  - K/V projection produces 4 KV heads
  - No permanent K/V duplication
  - Softmax is evaluated in FP32
  - Future positions are causally masked
  - Output shape is [B, S, 768]
  - Gradients reach Q/K/V/O projections
prohibited:
  - nn.MultiheadAttention
  - scaled_dot_product_attention
  - FlashAttention
  - xFormers attention
publicTestCommand: pytest tests/public/test_attention.py
submissionIdentity: immutable-git-commit
